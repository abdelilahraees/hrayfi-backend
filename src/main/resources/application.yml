# ============================================================
#  application.yml — committé.
#  Aucune valeur secrète en dur : tout vient de variables d'env.
#  Les secrets vivent dans `.env` (gitignoré) ou `application-local.yml`.
# ============================================================
spring:
  application:
    name: hrayfi-backend

  # Importe .env s'il existe (optionnel) pour que `./mvnw spring-boot:run` fonctionne
  # sans docker. En prod, les variables sont fournies par l'orchestrateur.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrayfi}
    username: ${DB_USERNAME:hrayfi}
    password: ${DB_PASSWORD:hrayfi}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway est maître du schéma, Hibernate ne touche à rien
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        default_batch_fetch_size: 20   # Mitige partiellement les N+1 sur collections
    open-in-view: false   # Bonne pratique : pas de session JPA ouverte en couche web

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ------------------------------------------------------------
#  Config applicative (préfixe `app`)
# ------------------------------------------------------------
app:
  security:
    jwt:
      # Secret base64. Générer avec : openssl rand -base64 48
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZC1yZXBsYWNlLW1lLXBsZWFzZS0xMjM0NTY3OA==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
      issuer: hrayfi-backend
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
