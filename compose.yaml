name: hrayfi

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrayfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrayfi}
      POSTGRES_USER: ${POSTGRES_USER:-hrayfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrayfi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrayfi-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrayfi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hrayfi.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrayfi-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  hrayfi-net:
    driver: bridge
